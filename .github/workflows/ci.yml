name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - name: Set browser path
        run: |
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' -print -quit)"
          test -n "$chromium_path"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - run: npm run test:browser
